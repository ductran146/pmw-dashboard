    html, body { min-height:100%; overflow-x:hidden; }

    .submod-page.active { flex:1; display:flex !important; min-height:0; }
    .dv-header { flex-shrink:0; }
    .sm-main { flex:1; min-width:0; display:flex; flex-direction:column; background:#F9FAFB; }
    .sm-breadcrumb {
      display:flex !important; align-items:center !important; align-self:stretch !important;

      margin:0 0 8px 0 !important; overflow:hidden !important;
    }
    .sm-bc-item, .sm-breadcrumb a, .sm-breadcrumb span {
      font-family:'Pretendard', var(--font), sans-serif !important; font-weight:400 !important;

      flex:none !important;
    }

    .sm-breadcrumb a.sm-bc-item:hover { color:#02457A !important; }
    .sm-bc-item.active, .sm-bc-item.current { color:rgba(17,24,39,0.5) !important; }
    .sm-bc-sep { width:8px !important; height:18px !important; color:rgba(17,24,39,0.5) !important; font-size:13px !important; line-height:18px !important; }
    .empty-main {
      flex:1; min-height:calc(100vh - 64px - 46px - 44px); display:flex; align-items:center; justify-content:center;
      padding:40px 20px 72px;
    }
    .empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; max-width:760px; margin:0 auto; }
    .empty-state svg { width:160px; height:160px; margin-bottom:32px; }
    .empty-title { font-family:'Pretendard', var(--font), sans-serif; font-size:28px; line-height:36px; font-weight:700; color:#02457A; margin-bottom:20px; }
    .empty-desc { font-family:'Pretendard', var(--font), sans-serif; font-size:24px; line-height:34px; font-weight:400; color:#4B5563; max-width:820px; }
    .dv-footer { margin-top:auto; }
    @media (max-width:900px) { .submod-page.active { flex-direction:column; } .sm-sidebar { width:100%; } }
    @media (max-width:640px) { .empty-main { padding:32px 16px 56px; } .empty-state svg { width:128px; height:128px; margin-bottom:24px; } .empty-title { font-size:22px; line-height:30px; } .empty-desc { font-size:18px; line-height:28px; } }
