<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <link rel="stylesheet" href="styles.css"/>
  <style>
    html, body { overflow: hidden; }
    .bao-cao-wrapper { display:flex; flex-direction:column; height:100vh; }
    .submod-page.active { flex:1; display:flex !important; min-height:0; }
    .dv-header { flex-shrink:0; }

    /* ── Scroll area ── */
    .dt-scroll-area {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 20px 24px; display: flex; flex-direction: column; gap: 24px;
    }
    .dt-scroll-area::-webkit-scrollbar { width: 5px; }
    .dt-scroll-area::-webkit-scrollbar-thumb { background: rgba(17,24,39,0.12); border-radius: 4px; }

    /* ── Card wrapper ── */
    .dt-section {
      background: #FFFFFF;
      border: 1px solid rgba(17,24,39,0.08) !important;
      border-radius: 16px;
      overflow: hidden;
    }

    /* Override dt-table-wrap border từ styles.css */
    .dt-table-wrap {
      border: none !important;
      border-radius: 0 !important;
    }

    /* ── 1. Tiêu đề bảng — theo Figma Title Table ── */
    .dt-table-wrap { display: flex; flex-direction: column; }
    .dt-table-title {
      /* gradient từ Figma */
      background: linear-gradient(90deg, rgba(1,138,190,0.16) 31.49%, rgba(255,255,255,0) 100%);
      height: 56px;
      display: flex; align-items: center;
      padding: 8px 8px 8px 20px;
      gap: 20px;
      /* font: Figma Body 1/Bold */
      font-family: var(--font,'Pretendard');
      font-size: 17px; font-weight: 700; line-height: 24px;
      color: #111827;
    }

    /* ── 2. Tiêu đề cột — theo Figma Table/Header ── */
    .dt-table { width: 100%; min-width: 1280px; border-collapse: collapse; table-layout: fixed; }
    /* ── Đồng bộ độ rộng cột cho 2 bảng số liệu kinh doanh ── */
    .dt-table th:nth-child(1), .dt-table td:nth-child(1) { width: 22%; }
    .dt-table th:nth-child(2), .dt-table td:nth-child(2) { width: 8%; }
    .dt-table th:nth-child(3), .dt-table td:nth-child(3) { width: 11%; }
    .dt-table th:nth-child(4), .dt-table td:nth-child(4) { width: 15%; }
    .dt-table th:nth-child(5), .dt-table td:nth-child(5) { width: 13%; }
    .dt-table th:nth-child(6), .dt-table td:nth-child(6) { width: 11%; }
    .dt-table th:nth-child(7), .dt-table td:nth-child(7) { width: 14%; }
    .dt-table th:nth-child(8), .dt-table td:nth-child(8) { width: 6%; }

    .dt-table thead tr { height: 40px; }
    .dt-table thead th {
      background: linear-gradient(0deg, rgba(1,138,190,0.08), rgba(1,138,190,0.08)), #FFFFFF;
      font-family: 'Pretendard', var(--font, sans-serif);
      font-style: normal;
      font-weight: 700;
      font-size: 14px;
      line-height: 20px;
      color: #005292;
      padding: 10px 8px;
      height: 40px;
      text-align: right;
      border-top: none !important;
      border-bottom: 1px solid rgba(17,24,39,0.08) !important;
      white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      vertical-align: middle;
    }
    .dt-table thead th:first-child {
      text-align: left;
      padding-left: 12px;
      background: linear-gradient(0deg, rgba(1,138,190,0.08), rgba(1,138,190,0.08)), #FFFFFF !important;
    }
    .dt-table thead th:last-child { padding-right: 12px; }

    /* Override sticky bg từ styles.css */
    .dt-table td:first-child { position: static !important; background: #FFFFFF !important; }
    .dt-table tbody td:first-child { background: #FFFFFF !important; }

    /* ── Body rows — thường: trắng ── */
    .dt-table tbody tr { height: 40px; border-bottom: 1px solid rgba(17,24,39,0.08); }
    .dt-table tbody tr:last-child { border-bottom: none; }
    .dt-table tbody tr:hover td { background: rgba(1,138,190,0.04) !important; }

    .dt-table tbody td {
      font-family: 'Pretendard', var(--font, sans-serif);
      font-size: 15px; font-weight: 400; line-height: 22px; color: #4B5563;
      border: none;
      vertical-align: middle; padding: 8px 8px;
      text-align: right; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      background: #FFFFFF !important;
    }
    .dt-table tbody td:first-child  { text-align: left; padding-left: 12px; }
    .dt-table tbody td:last-child    { padding-right: 12px; }

    /* ── Row nhấn mạnh: Tổng / Kỳ trước / Tăng giảm ── */
    .dt-table tr.dt-total td,
    .dt-table tr.dt-prev td,
    .dt-table tr.dt-delta td {
      background: linear-gradient(
        0deg,
        var(--P2_UI_Color-Table-Row-Emphasize, rgba(2, 69, 122, 0.05)) 0%,
        var(--P2_UI_Color-Table-Row-Emphasize, rgba(2, 69, 122, 0.05)) 100%
      ), var(--p--Neutral-White, #FFF) !important;
    }

    /* ── Row Tổng ── */
    .dt-table tr.dt-total td {
      border-top: 1px solid rgba(17,24,39,0.08);
      font-weight: 700; color: #02457A;
    }
    /* ── Row Kỳ trước ── */
    .dt-table tr.dt-prev td {
      font-weight: 500; color: #4B5563;
    }
    /* ── Row Tăng giảm ── */
    .dt-table tr.dt-delta td {
      border-top: 1px solid rgba(17,24,39,0.08);
      font-weight: 400;
    }
    .dt-table tr.dt-total td:first-child,
    .dt-table tr.dt-prev td:first-child,
    .dt-table tr.dt-delta td:first-child {
      font-weight: 700 !important;
      font-style: italic !important;
    }
    .dt-table tr.dt-delta td:first-child { color: #111827; }
    .val-pos { color: #16A34A !important; font-weight: 600; }
    .val-neg { color: #DC2626 !important; font-weight: 600; }
    .dt-cell-icon { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; }

    /* ── Responsive ≤1366px ── */
    @media (max-width: 1366px) {
      .dt-scroll-area { padding: 14px 16px; gap: 16px; }
      .dt-table-title { height: 46px; font-size: 14px; padding: 6px 8px 6px 16px; }
      .dt-table thead th { font-size: 12px; padding: 8px 6px; }
      .dt-table thead th:first-child { padding-left: 10px; }
      .dt-table tbody td { font-size: 13px; padding: 7px 6px; }
      .dt-table tbody td:first-child { padding-left: 10px; }
    }
  </style>
  <style>
    @media (max-width:1200px) {
      .sm-sidebar { width:52px; padding:12px 6px; overflow:hidden; }
      .sm-sidebar-label,.sm-nav-cat-label,.sm-nav-cat-arrow,

      .sm-main { overflow-y:auto; }
      .dt-table-wrap { overflow-x:auto; }
    }
    @media (max-width:640px) {
      .dv-header { padding:0 12px; }
      .dv-header-sub { display:none; }
    }
  </style>

  <script>
    document.addEventListener('pmw:components-loaded', () => {
      const head = document.querySelector('.business-report-page-head');
      if (!head) return;

      const title = 'Báo cáo số liệu kinh doanh';
      const subtitle = 'Theo dõi số khách hàng, sản lượng tiêu thụ, doanh thu, phí bảo vệ môi trường, thuế và tổng giá trị hóa đơn theo khu vực và đối tượng khách hàng';

      const brTitle = head.querySelector('.br-page-title, .sm-content-title');
      if (brTitle) brTitle.textContent = title;

      const brSubtitle = head.querySelector('.br-page-subtitle, .sm-content-subtitle');
      if (brSubtitle) brSubtitle.textContent = subtitle;

      const current = head.querySelector('.br-breadcrumb-current, .sm-bc-item.active, .sm-bc-item.current');
      if (current) current.textContent = 'Số liệu kinh doanh';

      const links = head.querySelectorAll('.br-breadcrumb-link, .sm-bc-item[href]');
      if (links[0]) {
        links[0].textContent = 'Quản lý điều hành';
        links[0].setAttribute('href', 'quanly-dieuhanh.html');
      }

      const button = head.querySelector('.br-filter-button, .sm-filter-btn');
      if (button) button.setAttribute('type', 'button');

      const form = head.querySelector('form');
      if (form) form.addEventListener('submit', (event) => event.preventDefault());
    });
  </script>

  <script>
  (function renderBusinessDataTables() {
    // suffix khớp với id header đã có sẵn trong <thead> (bc-kd-table-<bang>-head-<suffix>)
    var COLUMN_DEFS = [
      { key: 'soKH', suffix: 'so-kh' },
      { key: 'soM3', suffix: 'so-m3-tieu-thu' },
      { key: 'doanhThu', suffix: 'doanh-thu' },
      { key: 'phiBVMT', suffix: 'phi-bvmt' },
      { key: 'thue5', suffix: 'thue-5' },
      { key: 'tong', suffix: 'tong' },
      { key: 'soHoaDon', suffix: 'so-hoa-don' }
    ];

    function formatNumber(n) {
      return Number(n || 0).toLocaleString('vi-VN');
    }

    function sumColumn(rows, key) {
      return rows.reduce(function (sum, row) { return sum + (Number(row[key]) || 0); }, 0);
    }

    function deltaCellHTML(id, value) {
      value = Number(value) || 0;
      var isPos = value >= 0;
      var cls = isPos ? 'val-pos' : 'val-neg';
      var stroke = isPos ? '#16A34A' : '#DC2626';
      var path = isPos
        ? 'M11.2269 6.71353L8.01333 3.5L4.7998 6.71353M8.01333 12.5V3.59'
        : 'M11.2271 9.28647L8.01358 12.5L4.80005 9.28647M8.01358 3.5V12.41';
      return '<td id="' + id + '" class="' + cls + '"><span class="dt-cell-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="' + path + '" stroke="' + stroke + '" stroke-width="1.25" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/></svg>' + formatNumber(Math.abs(value)) + '</span></td>';
    }

    // ID mỗi dòng dữ liệu: <prefix>-row-<slug>, mỗi ô: <prefix>-<slug>-<suffix>
    // (giống pattern id="bc-that-thoat-thang-row-..." / id="bc-that-thoat-thang-...-khu-vuc" ở các trang báo cáo khác)
    function renderDataRows(rows, idPrefix) {
      return rows.map(function (row) {
        var cells = COLUMN_DEFS.map(function (c) {
          return '<td id="' + idPrefix + '-' + row.id + '-' + c.suffix + '">' + formatNumber(row[c.key]) + '</td>';
        }).join('');
        return '<tr id="' + idPrefix + '-row-' + row.id + '"><td id="' + idPrefix + '-' + row.id + '-label">' + row.label + '</td>' + cells + '</tr>';
      }).join('');
    }

    function renderTotalRow(rows, idPrefix) {
      var cells = COLUMN_DEFS.map(function (c) {
        return '<td id="' + idPrefix + '-tong-' + c.suffix + '">' + formatNumber(sumColumn(rows, c.key)) + '</td>';
      }).join('');
      return '<tr id="' + idPrefix + '-row-tong" class="dt-total"><td id="' + idPrefix + '-tong-label">Tổng</td>' + cells + '</tr>';
    }

    function renderPrevRow(kyTruoc, idPrefix) {
      var cells = COLUMN_DEFS.map(function (c) {
        return '<td id="' + idPrefix + '-ky-truoc-' + c.suffix + '">' + formatNumber(kyTruoc[c.key]) + '</td>';
      }).join('');
      return '<tr id="' + idPrefix + '-row-ky-truoc" class="dt-prev"><td id="' + idPrefix + '-ky-truoc-label">Kỳ trước</td>' + cells + '</tr>';
    }

    function renderDeltaRow(delta, idPrefix) {
      var cells = COLUMN_DEFS.map(function (c) {
        return deltaCellHTML(idPrefix + '-tang-giam-' + c.suffix, delta[c.key]);
      }).join('');
      return '<tr id="' + idPrefix + '-row-tang-giam" class="dt-delta"><td id="' + idPrefix + '-tang-giam-label">Tăng/ Giảm</td>' + cells + '</tr>';
    }

    function renderTable(tbody, dataSet, idPrefix) {
      if (!tbody) return;
      if (!dataSet || !dataSet.rows || !dataSet.rows.length) {
        tbody.innerHTML = '<tr><td id="' + idPrefix + '-empty" colspan="' + (COLUMN_DEFS.length + 1) + '" style="text-align:center;color:#9CA3AF;">Không có dữ liệu cho kỳ đã chọn</td></tr>';
        return;
      }
      tbody.innerHTML =
        renderDataRows(dataSet.rows, idPrefix) +
        renderTotalRow(dataSet.rows, idPrefix) +
        renderPrevRow(dataSet.kyTruoc || {}, idPrefix) +
        renderDeltaRow(dataSet.delta || {}, idPrefix);
    }

    function renderPeriod(month, year) {
      var khuVucBody = document.getElementById('bc-kd-khu-vuc-table-tbody');
      var doiTuongBody = document.getElementById('bc-kd-doi-tuong-table-tbody');
      window.PMW_REPORT_DATA.fetchBcSoLieuKD(month, year).then(function (data) {
        renderTable(khuVucBody, data && data.khuVuc, 'bc-kd-khu-vuc');
        renderTable(doiTuongBody, data && data.doiTuong, 'bc-kd-doi-tuong');
        window.dispatchEvent(new Event('resize'));
      });
    }

    // Render kỳ mặc định khi mở trang (khớp option "selected" trong bộ lọc Tháng/Năm)
    document.addEventListener('DOMContentLoaded', function () { renderPeriod('04', '2026'); });

    // Bấm "Xem" => đọc Tháng/Năm đang chọn rồi render lại 2 bảng
    document.addEventListener('click', function (event) {
      if (event.target && event.target.id === 'filter-submit') {
        var monthEl = document.getElementById('filter-month');
        var yearEl = document.getElementById('filter-year');
        renderPeriod(monthEl ? monthEl.value : '04', yearEl ? yearEl.value : '2026');
      }
    });
  })();
  </script>

<script>
(function setupBusinessDataMobileTable() {
  const MOBILE_LABELS = {
    'bc-kd-khu-vuc-xi-nghiep-cap-nuoc-vung-tau-label': 'XN CN Vũng Tàu',
    'bc-kd-khu-vuc-xi-nghiep-cap-nuoc-ba-ria-label': 'XN CN Bà Rịa',
    'bc-kd-khu-vuc-xi-nghiep-cap-nuoc-long-dien-label': 'XN CN Long Điền',
    'bc-kd-khu-vuc-chi-nhanh-cap-nuoc-xuyen-moc-label': 'CN Xuyên Mộc',
    'bc-kd-khu-vuc-chi-nhanh-cap-nuoc-chau-duc-label': 'CN Châu Đức',
    'bc-kd-khu-vuc-nuoc-ban-si-cho-phu-my-label': 'Bán sỉ Phú Mỹ',
    'bc-kd-doi-tuong-sinh-hoat-do-thi-label': 'SH đô thị',
    'bc-kd-doi-tuong-sinh-hoat-nong-thon-label': 'SH nông thôn',
    'bc-kd-doi-tuong-dong-bao-dt-label': 'Đồng bào DT',
    'bc-kd-doi-tuong-co-quan-label': 'Cơ quan',
    'bc-kd-doi-tuong-san-xuat-label': 'Sản xuất',
    'bc-kd-doi-tuong-kinh-doanh-label': 'Kinh doanh'
  };

  const MOBILE_HEADERS = {
    'bc-kd-table-khu-vuc-head-label': 'Khu vực',
    'bc-kd-table-doi-tuong-head-label': 'Đối tượng',
    'bc-kd-table-khu-vuc-head-so-kh': 'Số KH',
    'bc-kd-table-doi-tuong-head-so-kh': 'Số KH',
    'bc-kd-table-khu-vuc-head-so-m3-tieu-thu': 'Sản lượng',
    'bc-kd-table-doi-tuong-head-so-m3-tieu-thu': 'Sản lượng',
    'bc-kd-table-khu-vuc-head-doanh-thu': 'Doanh thu',
    'bc-kd-table-doi-tuong-head-doanh-thu': 'Doanh thu',
    'bc-kd-table-khu-vuc-head-phi-bvmt': 'Phí BVMT',
    'bc-kd-table-doi-tuong-head-phi-bvmt': 'Phí BVMT',
    'bc-kd-table-khu-vuc-head-thue-5': 'Thuế 5%',
    'bc-kd-table-doi-tuong-head-thue-5': 'Thuế 5%',
    'bc-kd-table-khu-vuc-head-so-hoa-don': 'HĐ',
    'bc-kd-table-doi-tuong-head-so-hoa-don': 'HĐ'
  };

  function rememberDesktopText(el) {
    if (el && !el.dataset.desktopText) el.dataset.desktopText = el.textContent.trim();
  }

  function applyMobileTexts(isMobile) {
    Object.entries(MOBILE_LABELS).forEach(([id, mobileText]) => {
      const el = document.getElementById(id);
      if (!el) return;
      rememberDesktopText(el);
      el.textContent = isMobile ? mobileText : el.dataset.desktopText;
    });

    Object.entries(MOBILE_HEADERS).forEach(([id, mobileText]) => {
      const el = document.getElementById(id);
      if (!el) return;
      rememberDesktopText(el);
      el.textContent = isMobile ? mobileText : el.dataset.desktopText;
    });
  }

  function measureTextWidth(text, font) {
    const canvas = measureTextWidth.canvas || (measureTextWidth.canvas = document.createElement('canvas'));
    const context = canvas.getContext('2d');
    context.font = font;
    return Math.ceil(context.measureText(text || '').width);
  }

  function getFontForCell(cell) {
    const style = window.getComputedStyle(cell);
    return `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
  }

  function updateFirstColumnWidth(table) {
    if (!table) return;
    const firstColumnCells = Array.from(table.querySelectorAll('thead th:first-child, tbody td:first-child'));
    let maxTextWidth = 0;

    firstColumnCells.forEach((cell) => {
      const textWidth = measureTextWidth(cell.textContent.trim(), getFontForCell(cell));
      maxTextWidth = Math.max(maxTextWidth, textWidth);
    });

    const paddingTotal = 20; // 10px left + 10px right
    const calculatedWidth = Math.ceil(maxTextWidth + paddingTotal);
    table.style.setProperty('--bc-kd-first-col-width', `${calculatedWidth}px`);

    const col = table.querySelector('colgroup col:first-child');
    if (col) col.style.width = `${calculatedWidth}px`;
  }

  function restoreDesktopColumnWidth(table) {
    if (!table) return;
    table.style.removeProperty('--bc-kd-first-col-width');
    const col = table.querySelector('colgroup col:first-child');
    if (col) col.style.width = '22%';
  }

  function syncMobileTableLayout() {
    const isMobile = window.matchMedia('(max-width: 640px)').matches;
    applyMobileTexts(isMobile);

    document.querySelectorAll('body.pmw-page-bc-so-lieu-kd .dt-table').forEach((table) => {
      if (isMobile) updateFirstColumnWidth(table);
      else restoreDesktopColumnWidth(table);
    });
  }

  document.addEventListener('DOMContentLoaded', syncMobileTableLayout);
  document.addEventListener('pmw:components-loaded', syncMobileTableLayout);
  window.addEventListener('load', syncMobileTableLayout);
  window.addEventListener('resize', syncMobileTableLayout);
})();
</script>
